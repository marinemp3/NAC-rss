name: RSS Feed Generator

on:
  schedule:
    # 毎週金曜日 14:30 (UTC+8 = 中国時間)
    - cron: '30 6 * * 5'
  workflow_dispatch:  # 手動実行も可能

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 🔑 ここで書き込み権限を明示的に付与
    permissions:
      contents: write  # リポジトリの内容を書き込む権限

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 依存関係をインストール
        run: |
          pip install -r requirements.txt

      - name: RSSフィードを生成
        run: |
          python generate_rss.py

      - name: フィードファイルをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "RSSフィードを自動更新 [skip ci]"
          git push
