name: RSS Feed Generator

on:
  schedule:
    # 毎週金曜日 14:30 (UTC+8 = 中国時間)
    - cron: '30 6 * * 5'
  workflow_dispatch:  # 手動実行も可能

jobs:
  build:
    runs-on: ubuntu-latest
    
    # 🔑 ここで書き込み権限を明示的に付与
    permissions:
      contents: write  # リポジトリの内容を書き込む権限
      actions: write   # keepalive アクションが GitHub API を利用するために必要

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4
        with:
          # rebase を安全に行うため全履歴を取得
          fetch-depth: 0

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 依存関係をインストール
        run: |
          pip install -r requirements.txt

      - name: RSSフィードを生成
        run: |
          python generate_rss.py

      - name: フィードファイルをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "RSSフィードを自動更新 [skip ci]"
          # プッシュ前にリモートの変更を取り込む（競合回避）
          git pull --rebase origin ${{ github.ref_name }}
          git push
      
      # 60日間の無効化対策（keepalive）
      - name: Keepalive（ワークフロー無効化防止）
        if: always()
        uses: entepotenz/keep-github-actions-alive-min-dependencies@v1
        with:
          COMMIT_MESSAGE: "Keepalive: ワークフロー無効化防止"
          TIME_ELAPSED_THRESHOLD_IN_DAYS: 50
